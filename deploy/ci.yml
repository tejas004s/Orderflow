name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: unit tests
        run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: integration tests (testcontainers)
        run: go test -tags=integration -count=1 -timeout 15m ./...

  compose-smoke:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --wait
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: health endpoints
        run: |
          for p in 8080 8081 8082 8083 8084 8085; do
            curl -fsS "http://localhost:$p/readyz" && echo
          done
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
      - name: down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
